[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aninote"
version = "4.1.1"
description = "桌面便签工具 — 富文本编辑、待办事项、事务追踪、Bangumi 新番日历"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "HunterHasCome"}
]
keywords = ["desktop", "sticky-notes", "habit-tracker", "bangumi", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "requests>=2.28",
]

[project.scripts]
aninote = "app:main"

[project.urls]
Homepage = "https://github.com/TurboHunter-CN/AniNote"
Issues = "https://github.com/TurboHunter-CN/AniNote/issues"
